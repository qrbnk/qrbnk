<style>
        /* Base setup for brutalist interaction */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            cursor: none; /* Hide default cursor for custom experience */
            overflow: hidden; /* Lock viewport for entry screen */
        }

        /* The Magnifier / Inversion Loupe */
        .magnifier-lens {
            position: fixed;
            top: 0;
            left: 0;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: white; /* Key for difference blend mode */
            mix-blend-mode: difference; /* Inverts underlying colors */
            pointer-events: none; /* Let clicks pass through */
            transform: translate(-50%, -50%);
            z-index: 9999;
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        height 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        /* Interactive Element States */
        .interactive-target {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        opacity 0.3s ease;
            display: inline-block;
        }

        /* Level 1 Interaction (from Design System): Slight scale on hover */
        .interactive-target:hover {
            transform: scale(1.02);
        }

        /* Hide custom cursor on touch devices where hover isn't natural */
        @media (pointer: coarse) {
            body { cursor: auto; }
            .magnifier-lens { display: none; }
        }
    </style>

<!-- Script for Interaction Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const lens = document.getElementById('lens');
            const interactiveElements = document.querySelectorAll('a');
            
            // Track mouse movement
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let lensX = mouseX;
            let lensY = mouseY;

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            // Smooth animation loop for the lens
            function animateLens() {
                // Ease towards mouse position
                lensX += (mouseX - lensX) * 0.2;
                lensY += (mouseY - lensY) * 0.2;
                
                lens.style.transform = `translate(calc(${lensX}px - 50%), calc(${lensY}px - 50%))`;
                requestAnimationFrame(animateLens);
            }
            animateLens();

            // Expand lens over interactive elements
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    lens.style.width = '350px';
                    lens.style.height = '350px';
                });
                
                el.addEventListener('mouseleave', () => {
                    lens.style.width = '150px';
                    lens.style.height = '150px';
                });
            });
        });
    </script>
