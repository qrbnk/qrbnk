<style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            cursor: none; /* Hide standard cursor for the lens frame */
            overflow-x: hidden;
            background-color: #fbf9f9;
        }

        .interactive-target {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), color 0.3s ease;
            display: inline-block;
        }

        @keyframes wavyMotion {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .wave-char {
            display: inline-block;
            animation: wavyMotion 3s ease-in-out infinite;
            will-change: transform;
        }

        /* Magnifier Overlay Container */
        .magnifier-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
            will-change: clip-path;
            background: transparent;
        }

        .magnified-content {
            width: 100%;
            height: 100%;
            will-change: transform, transform-origin;
            pointer-events: none;
        }

        /* Glass Lens Border Ring (Joan Gaspar Loupe Style) */
        .magnifier-lens-ring {
            position: fixed;
            top: 0;
            left: 0;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 1.5px solid rgba(0, 0, 0, 0.65);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12), inset 0 0 4px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 9999;
            will-change: transform;
            background: rgba(255, 255, 255, 0.02);
        }

        @media (pointer: coarse) {
            body, html { cursor: auto; }
            .magnifier-wrapper, .magnifier-lens-ring { display: none !important; }
        }

        .title { font-family: "Source Serif 4", serif; letter-spacing: -0.01em; }

<!-- Script for Optical Magnifying Glass Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Apply wavy text effect to title
            const titleElement = document.querySelector('h1.title');
            if (titleElement) {
                const text = titleElement.textContent.trim();
                const words = text.split(' ');
                titleElement.innerHTML = '';
                let charIndex = 0;

                words.forEach((word, wordIndex) => {
                    const wordSpan = document.createElement('span');
                    wordSpan.className = 'inline-block whitespace-nowrap';

                    for (const char of word) {
                        const charSpan = document.createElement('span');
                        charSpan.textContent = char;
                        charSpan.className = 'wave-char';
                        charSpan.style.animationDelay = `${charIndex * 0.05}s`;
                        wordSpan.appendChild(charSpan);
                        charIndex++;
                    }

                    titleElement.appendChild(wordSpan);

                    if (wordIndex < words.length - 1) {
                        const spaceSpan = document.createElement('span');
                        spaceSpan.innerHTML = '&nbsp;';
                        spaceSpan.className = 'inline-block';
                        titleElement.appendChild(spaceSpan);
                        charIndex++;
                    }
                });
            }

            // Setup Magnifier DOM layers
            const originalContainer = document.getElementById('content-container');
            
            const magnifierWrapper = document.createElement('div');
            magnifierWrapper.className = 'magnifier-wrapper';
            magnifierWrapper.setAttribute('aria-hidden', 'true');
            
            const clonedContent = originalContainer.cloneNode(true);
            clonedContent.id = 'cloned-content';
            clonedContent.className = 'magnified-content absolute top-0 left-0 flex flex-col w-full h-full';
            
            clonedContent.querySelectorAll('*').forEach(el => {
                el.removeAttribute('id');
                el.setAttribute('tabindex', '-1');
            });
            
            magnifierWrapper.appendChild(clonedContent);
            document.body.appendChild(magnifierWrapper);

            // Circular lens frame
            const lensRing = document.createElement('div');
            lensRing.className = 'magnifier-lens-ring';
            document.body.appendChild(lensRing);

            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let lensX = mouseX;
            let lensY = mouseY;
            const lensRadius = 35; // 70px diameter lens

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function animateLens() {
                lensX += (mouseX - lensX) * 0.25;
                lensY += (mouseY - lensY) * 0.25;
                
                const scrollX = window.scrollX;
                const scrollY = window.scrollY;

                // Update clipping region and lens frame positioning
                magnifierWrapper.style.clipPath = `circle(${lensRadius}px at ${lensX}px ${lensY}px)`;
                lensRing.style.transform = `translate(${lensX}px, ${lensY}px) translate(-50%, -50%)`;
                
                // Scale magnified view centered precisely on cursor coordinates
                clonedContent.style.transformOrigin = `${lensX + scrollX}px ${lensY + scrollY}px`;
                clonedContent.style.transform = `scale(1.8)`;
                
                requestAnimationFrame(animateLens);
            }
            animateLens();
        });
    </script>
